<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio Builder — My Portfolios</title>
<style>
:root{
  --bg:#0E2A2B; --panel:#143B3C; --panel2:#0F3031; --line:#1E4344;
  --cream:#F3ECDA; --muted:#8FB3B0; --gold:#C9A96A; --gold2:#E0C48C;
  --danger:#E08A6D; --ok:#7FBFA0;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--cream);min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:32px 20px 80px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--gold),#8a6b3a);display:flex;align-items:center;justify-content:center;font-weight:800;color:#0E2A2B}
h1{font-size:1.7rem;margin:0;color:var(--cream)}
.tagline{color:var(--muted);margin:0 0 28px;font-size:.95rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
.card h2{margin:0 0 14px;font-size:1.05rem;color:var(--gold)}
label{display:block;font-size:.78rem;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.05em}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--cream);padding:11px 13px;font-size:.95rem;font-family:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:180px}
button{cursor:pointer;border:none;border-radius:10px;padding:11px 20px;font-size:.95rem;font-weight:600;font-family:inherit}
.btn-gold{background:var(--gold);color:#0E2A2B}
.btn-gold:hover{background:var(--gold2)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn-ghost:hover{color:var(--cream)}
.actions{display:flex;gap:10px;margin-top:18px}
.msg{margin-top:12px;font-size:.85rem;color:var(--muted);min-height:1.2em}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
.list-head{display:flex;justify-content:space-between;align-items:center;margin:34px 0 14px}
.list-head h2{margin:0;font-size:1.15rem;color:var(--cream)}
.pf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pf{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:border-color .15s, transform .15s}
.pf:hover{border-color:var(--gold);transform:translateY(-2px)}
.pf .title{font-weight:700;font-size:1.05rem;margin-bottom:4px}
.pf .artist{color:var(--muted);font-size:.85rem;min-height:1.2em;margin-bottom:10px}
.pf .meta{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
.badge{padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:700;letter-spacing:.03em}
.badge.pub{background:rgba(127,191,160,.15);color:var(--ok)}
.badge.priv{background:rgba(224,138,109,.12);color:var(--danger)}
.count{background:rgba(201,169,106,.14);color:var(--gold);padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:50px 20px;border:1px dashed var(--line);border-radius:14px}
.foot{margin-top:44px;text-align:center;color:#5E8280;font-size:.78rem}
.hidden{display:none}
@media(max-width:640px){.wrap{padding:22px 14px 60px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="dot">P</div><h1>Portfolio Builder</h1></div>
  <p class="tagline">Artist portfolios with AI-generated art — build, publish, and share your gallery.</p>

  <div class="card">
    <h2>Create a Portfolio</h2>
    <div class="row">
      <div><label for="p-title">Title</label><input id="p-title" placeholder="e.g. Golden Coast Paintings" maxlength="120"></div>
      <div><label for="p-artist">Artist name</label><input id="p-artist" placeholder="e.g. Aminah Osei" maxlength="120"></div>
    </div>
    <label for="p-desc">Description (optional)</label>
    <textarea id="p-desc" placeholder="A short line about this collection…" maxlength="2000"></textarea>
    <div class="actions">
      <button class="btn-gold" id="btn-create" onclick="createPortfolio()">Create Portfolio</button>
    </div>
    <div class="msg" id="cmsg"></div>
  </div>

  <div class="list-head"><h2>My Portfolios</h2><span id="pf-count" style="color:var(--muted);font-size:.85rem"></span></div>
  <div class="pf-grid" id="pf-grid"></div>
  <div class="empty hidden" id="empty">No portfolios yet — create your first one above.</div>

  <p class="foot">Powered by Zynora AI · Studio API</p>
</div>

<script>
const API = "https://studio-api-nqpm.onrender.com";
let KEY = localStorage.getItem("pb_key");

function $(id){return document.getElementById(id)}
function setMsg(id, text, cls){const m=$(id);m.textContent=text;m.className="msg "+(cls||"")}

async function ensureKey(){
  if (KEY) return KEY;
  setMsg("cmsg","Setting up your studio access…");
  const r = await fetch(API + "/v1/developers/signup", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({email: "portfolio-" + Math.random().toString(36).slice(2,10) + "@builder.app"})
  });
  const d = await r.json();
  if (!d.key) throw new Error("Could not set up access. Try again in a minute.");
  KEY = d.key;
  localStorage.setItem("pb_key", KEY);
  setMsg("cmsg","");
  return KEY;
}

async function api(path, opts){
  const o = Object.assign({}, opts, {headers: Object.assign({"x-api-key": KEY, "Content-Type":"application/json"}, (opts&&opts.headers)||{})});
  const started = Date.now();
  const res = await fetch(API + path, o);
  if (res.status === 429){ throw new Error("The studio is busy (free tier limit). Try again in a minute."); }
  if (Date.now() - started > 5000) setMsg("cmsg","The studio was asleep — first load can be slow.","");
  if (!res.ok){
    let e = "Request failed";
    try{ e = (await res.json()).error || e }catch(_){}
    throw new Error(e);
  }
  return res.json();
}

async function createPortfolio(){
  const title = $("p-title").value.trim(), artist = $("p-artist").value.trim(), description = $("p-desc").value.trim();
  if (!title) return setMsg("cmsg","Give your portfolio a title first.","err");
  $("btn-create").disabled = true; $("btn-create").textContent = "Creating…";
  try{
    await ensureKey();
    await api("/v1/portfolios", {method:"POST", body: JSON.stringify({title, artist, description})});
    $("p-title").value=""; $("p-artist").value=""; $("p-desc").value="";
    setMsg("cmsg","Portfolio created ✓","ok");
    loadPortfolios();
  }catch(e){ setMsg("cmsg", e.message, "err"); }
  $("btn-create").disabled=false; $("btn-create").textContent="Create Portfolio";
}

async function loadPortfolios(){
  try{
    await ensureKey();
    const d = await api("/v1/portfolios");
    const list = d.portfolios || [];
    $("pf-count").textContent = list.length + (list.length===1 ? " portfolio" : " portfolios");
    $("empty").classList.toggle("hidden", list.length>0);
    const grid = $("pf-grid"); grid.innerHTML = "";
    for (const p of list){
      const el = document.createElement("div");
      el.className = "pf";
      el.onclick = () => location.href = "portfolio.html?id=" + p.id;
      el.innerHTML = `<div class="title"></div><div class="artist"></div>
        <div class="meta"><span class="count">…</span>
        <span class="badge ${p.published ? "pub" : "priv"}">${p.published ? "Published" : "Private"}</span></div>`;
      el.querySelector(".title").textContent = p.title;
      el.querySelector(".artist").textContent = p.artist ? "by " + p.artist : "";
      grid.appendChild(el);
      // artwork count (fetched per portfolio)
      api("/v1/portfolios/" + p.id).then(d2 => {
        el.querySelector(".count").textContent = (d2.artworks||[]).length + " artwork" + ((d2.artworks||[]).length===1?"":"s");
      }).catch(()=>{ el.querySelector(".count").textContent = "0 artworks"; });
    }
  }catch(e){ setMsg("cmsg", e.message, "err"); }
}

loadPortfolios();
</script>
</body>
</html>
